version: "3.8"

services:
  postgers_data_base:
    image: postgres:16-alpine
    container_name: postgres_data_base
    env_file:
      - .env_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgres/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "]
      interval: 5s
      timeout: 10s
      retries: 5


volumes:
  pgdata:
